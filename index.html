function rank(){const n=pick([120,150,180,200]);return Math.max(1,Math.round(n*(1-(1/(1+Math.exp(-(S.hv-50)/7))))))+"/"+n}

function passP(sv){if(!sv)return .15;return 1/(1+Math.exp(-(myHV()-sv+1)/2.3))}

function testK(){

  if(!reds.length){log(`${nm}。${subs.length}科目の平均${avg}点、赤点なし。`);add("joy",2)}
  else{const rs=reds.map(x=>`「${x}」`).join("");
    if(lost.length)log(`${nm}。平均${avg}点。${rs}が60点に届かず赤点。再試験でも${lost.map(x=>`「${x}」`).join("")}を落とした。`,"red");
    else log(`${nm}。平均${avg}点。${rs}で赤点。再試験で回収した。`,"red");

function step(){
  if(S.done||S.pending)return;
  const prev=S.log.length;
  applyAlloc();
  if(S.phase==="chu"){const k=`${S.year}${S.sem}`;CHU[k]&&CHU[k]();chuTest();if(S.flags.juku===1)S.assets-=3}
  else if(S.phase==="kosen"){
    if(S.abroadSems>0){S.abroadSems--;S.abroadNow=true;add("eng",14);add("rel",3);add("joy",3);
      log(pick([`${S.country}のホストファミリーの家で、毎晩夕食のときに英語で一日を話した。`,`${S.country}の高校で、物理の授業だけは誰よりも速く解けた。`,`${S.country}の友だちと、週末に湖までドライブした。`,"留学先の授業の単位を、成績証明書にまとめて日本に送った。"]));
      if(S.abroadSems===0)log(`${S.country}から帰国した。向こうで取った単位は、まとめて認定された。`,"big");
      pushMap(prev);inAdv=true;advance();inAdv=false;return}
    S.abroadNow=false;
    if(S.kyugaku){S.kyugaku=false;log("半年間の休学を終えて、同じ学期から復学した。","dec");add("joy",10);pushMap(prev);return}
    const k=`${S.year}${S.sem}`;if(KOSEN[k]&&!S.seen[k]){S.seen[k]=1;KOSEN[k]()}else if(KOSEN[k])log(`2回目の${S.year}年${S.sem?"後期":"前期"}。後輩だった人たちと同じ教室にいる。`);
    kosenRandom();
  }else if(S.phase==="hs"){log(pick(["高校の物理の授業で、ふと高専のことを思い出した。","高校の文化祭。普通の青春だった。","大学受験の模試を受けた。","部活と勉強の両立に追われた。"]))}
  else if(S.phase==="abroad")abroadYear();
  else if(S.phase==="univ"||S.phase==="senkou"){
    if(S.edu==="博士")log(pick(["国際学会で、英語で発表した。質疑で手が震えた。","論文が査読で2回差し戻された。","研究室の後輩の実験を見ながら、自分の実験は夜にやった。","学振の特別研究員に採用された。"]));else
    log(S.phase==="univ"?pick([`${S.dest}の研究室に配属された。大学から入った同期は、旋盤を触ったことがなかった。`,"大学のサークルに入ってみた。高専の話をすると珍しがられた。","大学院の入試を受けて合格した。","TA（ティーチング・アシスタント）として実験を教えた。"]):pick(["専攻科で学会発表をした。","専攻科の特別研究で、企業と共同研究をした。","学位授与機構への論文審査を通った。"]));
  }else workYear();
  pushMap(prev);
  if(!S.pending){inAdv=true;advance();inAdv=false}
}
function chuTest(){if(R()<.6){S.hv=clamp(S.hv+gauss()*1.5+(S.flags.juku?.8:0)+(S.st.know-50)/40,25,78);log(`定期テスト。学年${rank()}位。`)}}
function pushMap(prev){S.joySum+=S.st.joy;S.joyN++;const evs=S.log.slice(prev);S.map.push({j:S.st.joy,r:evs.some(e=>/red/.test(e.cls)),b:evs.some(e=>/big/.test(e.cls)),ph:S.retired?"old":S.phase,age:S.age})}
function advance(){
  if(S.done)return;
  const ph=S.phase;
  if(ph==="chu"){if(S.sem===0){S.sem=1;S.age++;return}if(S.year===3){if(S.flags.enter){S.phase="kosen";S.year=1;S.sem=0;S.age=15}return}S.year++;S.sem=0;return}
  if(ph==="kosen"){
    if(!S.abroadNow)testK();add("joy",gauss()*3);
    if(S.st.joy<8&&R()<.2){S.kyugaku=true;log("心身の調子を崩し、次の学期を休学することにした。","red");note("休学を経験",.03);S.st.joy=55}
    if(S.sem===1){
      if(S.lost>=3){S.ryunen++;
        if(S.ryunen>=2){log("二度目の原級留置。規定により、高専を去ることになった。","red");note("2度留年して退学",.012);dropout();return}
        log(`不認定科目が${S.lost}つ。進級判定会議の結果、${S.year}年生をもう一度やることになった。`,"red");note("留年を経験",.06);add("joy",-15);S.lost=0;S.sem=0;return}
      if(S.lost===2)log("不認定科目が2つ。ぎりぎりで仮進級。担任から呼び出された。","red");
      S.lost=0;if(S.year===5){graduate();return}S.year++;S.sem=0;
    }else{S.sem=1;S.age++}
    return}
  if(ph==="hs"){S.age++;S.year++;if(S.year>=3){log("高校を卒業した。","big");
      if(R()<.55){S.phase="univ";S.univLen=4;S.year=0;S.edu="大学";S.dest="地元の大学の工学部";log("地元の大学の工学部に進んだ。")}else{S.edu="高校";S.phase="pre";jobHunt(false)}}return}
  if(ph==="abroad"){S.age++;S.year++;
    if(S.year>=S.univLen){log(`${S.age}歳、${S.dest}を卒業し、${S.degree}を取得した。`,"big");S.phase="pre";jobHunt(false)}return}
  if(ph==="univ"||ph==="senkou"){S.age++;S.year++;
    if(S.year>=S.univLen){log(ph==="univ"?(S.edu==="博士"?`${S.age}歳、博士（工学）の学位を取った。`:`${S.age}歳、${S.dest}を卒業した。`):`${S.age}歳、専攻科を修了し、学士（工学）を取得した。`,"big");S.phase="pre";jobHunt(false)}return}
  if(ph==="pre"){S.phase="work";return}
  S.age++;
  add("hp",(S.age>=80?-2.2:S.age>=70?-1.5:S.age>=50?-.8:0)+gauss()*1.2);
  if(S.flags.loan&&S.age<=35)S.assets-=12;
  const q=Math.exp((S.fem?-11.4:-10.7)+.095*S.age)*Math.exp((55-S.st.hp)/35);
  if(R()<q)die();
}

function choose(o){
  if(o.cost&&S.assets<o.cost)return;
  const na=S.pending.noAdv;S.pending=null;if(o.cost)S.assets-=o.cost;o.fn();
  if(!S.pending&&S.queue.length)S.pending=S.queue.shift();
  if(S.done){render();return}
  if(!S.pending&&!na){inAdv=true;advance();inAdv=false}
  if(S.phase==="pre"&&!S.pending)S.phase="work";
  syncAlloc();render()}
const affordable=o=>!o.locked&&!(o.cost&&S.assets<o.cost);

// ===================== 自動再生 =====================
let timer=null,speed=2,playing=false,omakase=false;
function tick(){
  if(!S){stop();return}
  if(S.pending){if(omakase){const ok=S.pending.opts.filter(affordable),safe=ok.filter(o=>/[ABC]/.test(o.jd||"A"));choose(pick(S.pending.list&&safe.length?safe:ok))}else{stop();render()}return}
  if(S.done){stop();render();return}
  step();render();
}
function play(){if(!S||S.done&&!S.pending)return;playing=true;clearInterval(timer);timer=setInterval(tick,1200/speed);render()}
function stop(){playing=false;clearInterval(timer);timer=null}

function lifeScore(){const r=rarity();const rare=Math.round(Math.max(0,4-Math.log10(Math.max(r.n,.001)))*1500);const joy=Math.round((S.joySum/Math.max(1,S.joyN))*30);const money=Math.round(S.life/20);const age=S.age*15;return{rare,joy,money,age,total:rare+joy+money+age}}
function settle(){
  if(S.settled)return;S.settled=true;
  const got=store.get("ach",{}),newA=[];ACH.forEach(([id,n,d,f])=>{let ok=false;try{ok=f()}catch(e){}if(ok&&!got[id]){got[id]=1;newA.push(id)}});store.set("ach",got);S.newAch=newA;
  if(S.chal){const c=CHAL.find(c=>c[0]===S.chal);let ok=false;try{ok=c[3]()}catch(e){}S.chalOK=ok;if(ok){const cl=store.get("chal",{});cl[S.chal]=1;store.set("chal",cl)}}
  const sc=lifeScore();S.score=sc;const best=store.get("best",0);S.newBest=sc.total>best;if(S.newBest)store.set("best",sc.total);
  const hist=store.get("hist",[]);hist.unshift({t:lifeTitle(),rk:rarity().rk,n:rarity().n,sc:sc.total,age:S.age,pref:S.pref,school:S.school||"",seed:S.seed});store.set("hist",hist.slice(0,12));
  store.set("plays",store.get("plays",0)+1);
  const urg=store.get("ur",{}),newU=[];(S.ur||[]).forEach(id=>{if(!urg[id]){urg[id]=1;newU.push(id)}});store.set("ur",urg);S.newUr=newU;
}

function topN(){return S.notable.slice().sort((a,b)=>a.p-b.p).slice(0,2)}
function rarity(){let p=1;topN().forEach(n=>p*=n.p);const n=10000*p;return{n,rk:n<1?"UR":n<8?"SSR":n<40?"SR":n<200?"R":"N"}}
function fmtN(n){if(n<1)return"1人もいない";if(n<10)return`約${n.toFixed(1)}人`;return`約${Math.round(n).toLocaleString()}人`}
function lifeTitle(){
  const J=S.retired&&S.best?S.best:S.job;
  if(J){const co=J.co.replace(/（.*）/,"");const ttl=J.title&&!["嘱託","顧問"].includes(J.title)?J.title:"";
    return S.retired?`元・${co}の${ttl||J.role}`:`${co}の${ttl?ttl+"・":""}${J.role}`}
  return S.school?`${S.school}の卒業生`:"高専に行かなかった人";
}
function eduLabel(){return S.edu==="海外大学"?`${S.dest} ${S.degree}`:S.edu==="大学"?`${S.dest}卒`:S.edu==="専攻科"?"高専専攻科修了（学士）":S.edu==="高専"?"高専卒（準学士）":S.edu==="高専中退"?"高専中退":S.edu==="高校"?"高校卒":S.edu}
function epilogue(){
  const t=[];
  if(!S.school)t.push("高専には行かなかった。テレビで高専ロボコンを見ると、少しだけチャンネルを止めた。");
  else t.push(`${S.school} ${deptName()}${S.clubName&&S.club!=="none"?`、${S.clubName}${S.flags.bucho?"の部長":""}`:""}。`);
  if(S.dream){const got=(S.jobInds||[]).includes(S.dream);t.push(`将来の夢は「${dreamName()}」。${got?"その夢の業界で働いた。":"夢とは別の道を歩いた。"}`)}
  if(S.job)t.push(`最後の肩書きは${lifeTitle()}。生涯年収は約${(S.life/10000).toFixed(2)}億円。`);
  t.push(S.married?`家族は${S.flags.widow?"先立った配偶者":"配偶者"}${S.kids?`と子ども${S.kids}人`:""}${S.grand?"、それに孫":""}。`:"結婚はしなかった。");
  t.push(`${S.age}歳、${S.cause}で亡くなった。`);
  if(S.last)t.push(`最期に思い出したのは、${S.last}。`);
  return t;
}

function dreamHTML(){
  const cur=S.dream;
  return`<section class="card dream"><div class="alloc-head"><span class="label">将来の夢（いつでも変えられる）</span><span class="small muted">いまの夢：<b>${esc(dreamName())}</b></span></div>
  <div class="dchips">${Object.entries(DREAMS).map(([k,d])=>`<button class="dchip" data-dk="${k}" aria-pressed="${cur===k}">${d.n}</button>`).join("")}</div>
  <form class="dform" id="dform"><input id="dtext" type="text" maxlength="24" placeholder="自分で書く（例：はやぶさのような探査機をつくる）" value="${cur==="custom"?esc(S.dreamText):""}"><button class="pbtn" type="submit">夢にする</button></form>
  <p class="small muted">${cur?"夢に近い部活・学科・進路を選ぶほど熱量が上がり、就職で夢の業界を受けやすくなる。変えると熱量は半分になる。":"夢を決めると、就職のときに夢の業界の会社が選べるようになる。"}</p></section>`}
function allocHint(){const k=S.allocK;return{
  chu:"勉強は偏差値、部活は健康と人間関係、遊びと休養は幸福。勉強ばかりだと幸福が下がる。",
  kosen:"勉強は試験と知識、部活は部の実力（大会の結果）、バイトはお金、遊びは幸福と友だち、休養は健康。",
  univ:"勉強・研究は知識と技術、バイトはお金。",
  work:"仕事は昇進と年収、家族・恋愛は結婚や子ども、趣味は幸福（お金を使う）、健康は寿命に効く。",
  old:"趣味は幸福、家族は孫や人間関係、健康は寿命に効く。"}[k]}
function birthHTML(){const share=PREFS.find(p=>p[0]===S.pref)[1]/PREFS.reduce((s,p)=>s+p[1],0)*100;
  const pub=SCHOOLS.find(s=>s[3]==="公立"&&s[1]===S.pref);
  return`<section class="card birth">
  <span class="label">誕生カード</span>
  <p class="big">${full(S.pref)}に、${S.fem?"女の子":"男の子"}として生まれた。</p>
  <dl><dt>名字</dt><dd>${S.sur}</dd><dt>家庭の収入</dt><dd>${S.wealth}</dd><dt>中学</dt><dd>${full(S.pref)}の公立中学校</dd><dt>はじめの偏差値</dt><dd class="num">${Math.round(S.hv)}</dd></dl>
  <p class="oneof">${setup.birth==="babies"?`${full(S.pref)}で生まれるのは、全国の赤ちゃんの約${share.toFixed(1)}%。`:"47都道府県から、等しい確率で選ばれた。"}${pub?` ${full(S.pref)}生まれなので、${pub[0]}を受験できる。`:""}${NO_KOSEN.includes(S.pref)?` ${full(S.pref)}には高専がない。`:""}</p>
</section>`}
function birthMini(){return`<p class="small muted">${full(S.pref)}生まれ・${S.sur}${S.fem?"さん":"くん"}${S.school?`・${S.school} ${deptName()}（${S.dorm?"寮":"自宅"}）`:`・家庭の収入${S.wealth}`}</p>`}
function mapHTML(){
  const col={chu:"--c-hp",kosen:"--c-know",hs:"--c-rel",univ:"--c-rel",senkou:"--c-rel",abroad:"--c-rel",work:"--c-joy",pre:"--c-joy",old:"--c-old"};
  const cells=S.map.map(c=>{const a=.25+c.j/130;return`<i class="${c.r?"r":c.b?"s":""}" style="background:color-mix(in srgb,var(${col[c.ph]}) ${Math.round(a*100)}%,var(--line))" title="${c.age}歳"></i>`}).join("");
  return`<div class="map">${cells}</div><div class="legend"><span><i style="background:var(--c-hp)"></i>中学</span><span><i style="background:var(--c-know)"></i>高専</span><span><i style="background:var(--c-rel)"></i>高校・大学</span><span><i style="background:var(--c-joy)"></i>仕事</span><span><i style="background:var(--c-old)"></i>引退後</span><span>濃いほど幸福・赤い点はつらい年</span></div>`}
function renderEnd(){
  settle();const sc=S.score;
  const r=rarity(),stars=S.log.filter(e=>e.star),top=topN();
  const km=S.notable.length?top.concat(S.notable.filter(n=>!top.includes(n))).map(n=>`<li><span class="num">${n.age}歳</span><span>${top.includes(n)?"★ ":""}${esc(n.t)}</span><span class="p">${n.p>=.01?Math.round(n.p*100)+"%":(n.p*100).toFixed(1)+"%"}</span></li>`).join(""):`<li><span class="num">—</span><span>確率に効くような出来事はなかった。それも多数派の人生。</span><span></span></li>`;
  app.innerHTML=`
  <section class="share">
    <span class="k">1万分の1 高専版 ・ ${full(S.pref)}生まれ ・ ${S.age}歳没</span>
    <h2>${esc(lifeTitle())}</h2>
    <div><span class="k">同じ人生を送る人は、1万人中</span><div class="n">${fmtN(r.n)}<span class="rk">${r.rk}</span></div></div>
    <div class="row">${[S.school,S.school?deptName():"",eduLabel(),S.job?`生涯年収 ${(S.life/10000).toFixed(2)}億円`:""].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    <div class="candle"><i></i>${S.sur}${S.fem?"さん":"くん"}　${S.age}年の人生　・　人生の種 ${S.seed}</div>
  </section>
  <section class="card scorecard">
    <div class="alloc-head"><span class="label">人生スコア${S.newBest?"　<b class=\"newb\">自己ベスト更新</b>":""}</span><b class="num big2">${sc.total.toLocaleString()}</b></div>
    <div class="facts"><div><span>レア度</span><b class="num">${sc.rare.toLocaleString()}</b></div><div><span>幸福の平均</span><b class="num">${sc.joy.toLocaleString()}</b></div><div><span>生涯年収</span><b class="num">${sc.money.toLocaleString()}</b></div><div><span>寿命</span><b class="num">${sc.age.toLocaleString()}</b></div></div>
    ${S.chal?`<p class="chalres ${S.chalOK?"ok":""}">チャレンジ「${esc(CHAL.find(c=>c[0]===S.chal)[1])}」：<b>${S.chalOK?"達成":"未達成"}</b></p>`:""}
    ${S.newUr&&S.newUr.length?`<div><span class="label">UR人生を解放</span><div class="achs">${S.newUr.map(id=>{const u=URS.find(x=>x[0]===id);return`<div class="ach ur on new"><b>${esc(u[1])}</b><small>${esc(u[2])}</small></div>`}).join("")}</div></div>`:""}
    ${S.newAch&&S.newAch.length?`<div><span class="label">新しく解放した実績</span><div class="achs">${S.newAch.map(id=>{const a=ACH.find(x=>x[0]===id);return`<div class="ach on new"><b>${esc(a[1])}</b><small>${esc(a[2])}</small></div>`}).join("")}</div></div>`:""}
  </section>
  <section class="card" style="display:grid;gap:14px">
    <div class="facts">${STAT.map(([k,n])=>`<div><span>${n}</span><b class="num">${Math.round(S.st[k])}</b></div>`).join("")}<div><span>技術</span><b class="num">${Math.round(S.tech)}</b></div><div><span>遺した貯金</span><b class="num">${Math.round(Math.max(0,S.assets))}万円</b></div></div>
    <div><span class="label">この人生を特徴づける出来事（★の2つをかけ合わせて1万人中の人数）</span><ul class="km">${km}</ul></div>
    <div><span class="label">一生のまとめ</span><div class="epi">${epilogue().map(t=>`<p>${esc(t)}</p>`).join("")}</div></div>
    ${stars.length?`<div><span class="label">☆をつけた記録</span><ul class="km">${stars.map(e=>`<li><span class="num">${e.age}歳</span><span>${e.t}</span><span></span></li>`).join("")}</ul></div>`:""}
    <div><span class="label">人生地図</span>${mapHTML()}</div>
    <details><summary>すべての記録を見る</summary><div class="log">${S.log.map(e=>`<div class="ev ${e.cls}"><span class="a">${e.a}<br>${e.age}歳</span><p>${e.t}</p><span></span></div>`).join("")}</div></details>
    <div class="player"><button class="btn" id="again">もう一度生まれる</button><button class="btn ghost" id="same">同じ種でやり直す</button><button class="btn ghost" id="copy">結果をコピー</button><a class="btn ghost" id="post" target="_blank" rel="noopener" href="#">Xに投稿</a><button class="btn ghost" id="home">タイトルへ</button></div>
  </section>${srcHTML()}`;
  document.getElementById("again").onclick=()=>{setup.seed="";S=newLife();syncAlloc();render();window.scrollTo({top:0})};
  document.getElementById("same").onclick=()=>{const sd=S.seed;S=newLife(sd);syncAlloc();render();window.scrollTo({top:0})};
  const shareText=`【1万分の1 高専版】${full(S.pref)}生まれ・${S.age}歳没\n${lifeTitle()}\n同じ人生の人：1万人中${fmtN(r.n)}（${r.rk}）\n人生スコア ${sc.total.toLocaleString()}・人生の種 ${S.seed}\n#1万分の1高専版`;
  document.getElementById("post").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText);
  document.getElementById("home").onclick=()=>{S=null;render();window.scrollTo({top:0})};
  const cp=document.getElementById("copy");cp.onclick=()=>{const t=shareText;
    navigator.clipboard.writeText(t).then(()=>cp.textContent="コピーしました").catch(()=>cp.textContent="コピーできませんでした")};
}
function srcHTML(){return`<section class="card src"><span class="label">データについて</span>
<p>国立51高専の学科・コースは<a href="https://www.kosen-k.go.jp/wp/wp-content/uploads/2026/07/2027KOSEN_yoko.pdf" target="_blank" rel="noopener">令和9年度 国立高専 学生募集要項</a>に、商船学科の有無は各校の情報に、公立・私立は各校の公表情報（<a href="https://www.metro-cit.ac.jp/index.html" target="_blank" rel="noopener">都立産技高専</a>、<a href="https://www.pref.osaka.lg.jp/documents/9340/08_sankousiryou1-3.pdf" target="_blank" rel="noopener">大阪府資料</a>、<a href="https://www.niad.ac.jp/storage/006/202502/no6_1_3_jiko_kindai_k_202502.pdf" target="_blank" rel="noopener">近大高専 自己評価書</a>など）に合わせた。出生地は都道府県別出生数（人口動態統計2024）、偏差値は<a href="https://jyuke-labo.com/kousen/hensachi/" target="_blank" rel="noopener">受験ラボの一覧</a>の最高値が目安。女子比率は約4分の1（<a href="https://www.kosen-k.go.jp/wp/wp-content/uploads/2026/07/R8_gakusei_table.pdf" target="_blank" rel="noopener">高専機構</a>）。各校の校風や名物部活の描写、公立高専の出生地ルール、確率、年収はゲーム上の設定。</p></section>`}
render();
</script>

</body>
</html>
